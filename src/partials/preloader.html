<!-- PRELOADER: visible from the first paint (pure CSS), wiped away by GSAP on every page load -->
<div class="preloader" data-preloader aria-hidden="true">
  <div class="pbg" data-preloader-bg><svg class="topo" id="topoPre" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1440 900" data-preloader-bg-image></svg></div>
  <div class="plogo" data-preloader-logo>
    <svg class="pm"><use href="#st-mark"/></svg>
    <svg class="pw"><use href="#st-word"/></svg>
    <svg class="pt"><use href="#st-tag"/></svg>
  </div>
</div>
